<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>AST Візуалізація</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .node circle { fill: #fff; stroke: #4caf50; stroke-width: 3px; }
        .node text { font: 14px sans-serif; }
        .link { fill: none; stroke: #ccc; stroke-width: 2px; }
    </style>
</head>
<body>
    <h2>Абстрактне синтаксичне дерево (AST)</h2>
    <svg width="960" height="600"></svg>
    <script>
        d3.json("ast.json").then(function(treeData) {
            if(!treeData) return;
            const svg = d3.select("svg"), width = +svg.attr("width"), height = +svg.attr("height");
            const g = svg.append("g").attr("transform", "translate(40,40)");
            const tree = d3.tree().size([width - 80, height - 160]);
            const root = d3.hierarchy(treeData);
            tree(root);

            const link = g.selectAll(".link").data(root.descendants().slice(1))
                .enter().append("path").attr("class", "link")
                .attr("d", d => `M${d.x},${d.y} C${d.x},${(d.y + d.parent.y) / 2} ${d.parent.x},${(d.y + d.parent.y) / 2} ${d.parent.x},${d.parent.y}`);

            const node = g.selectAll(".node").data(root.descendants())
                .enter().append("g").attr("class", "node")
                .attr("transform", d => `translate(${d.x},${d.y})`);

            node.append("circle").attr("r", 20);
            node.append("text").attr("dy", 5).attr("text-anchor", "middle").text(d => d.data.name);
        });
    </script>
</body>
</html>
